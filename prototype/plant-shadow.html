<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Plant Shadow Prototype</title>
	<style>
		html, body { margin: 0; height: 100%; background: #1a1a1a; overflow: hidden; }
		canvas { display: block; }
		#hint {
			position: fixed; left: 16px; bottom: 12px; z-index: 10;
			font: 12px/1.4 system-ui, sans-serif; color: #cfc9bd; opacity: 0.8;
		}
		/* Same self-hosted font the main site uses for display headings - see
		   src/CSS/palette.css. Only ships a Regular cut, so font-synthesis is
		   turned off below rather than letting the browser fake a bold. */
		@font-face {
			font-family: 'Ivar Display';
			src: url('../fonts/IvarDisplay-Regular.ttf') format('truetype');
			font-weight: 400;
			font-display: swap;
		}
		/* Big overlaid title text, sitting on top of the wall/shadow like the
		   reference mockup - pointer-events:none so it doesn't block orbit drag. */
		#overlay-text {
			position: fixed; left: 6%; top: 30%; z-index: 5;
			pointer-events: none;
			font-family: 'Ivar Display', serif;
			font-weight: 400;
			font-synthesis: none;
			font-size: 11vw;
			line-height: 0.92;
			letter-spacing: -0.01em;
			color: #d8241c;
			text-transform: uppercase;
		}
	</style>
</head>
<body>
	<div id="hint">drag to orbit &middot; scroll to zoom (camera starts framed on the wall)</div>
	<div id="overlay-text">Shadow<br>Study</div>
	<script type="module" src="./plant-shadow.js"></script>
</body>
</html>
